
version: 2

models:
  - name: fct_grants
    description: "Grants data from CG. Cleaned and deduplicated."
    semantic_model:
      enabled: true
      name: grants
    agg_time_dimension: grant_date
    columns:
      - name: grant_id
        description: "Autogenerated primary key for each grant, built from grant name, organization name, amount and date"
        entity:
          type: primary
          name: grant
        data_tests:
          - unique
          - not_null
      - name: grant
        description: "The name of the grant"
      - name: amount
        description: "The amount of the grant in USD"
        data_tests:
          - not_null
      - name: focus_area_id
        description: "A unique identifier for the focus area"
        entity:
          type: foreign
          name: focus_area
      - name: grant_date_text
        description: "The date of the grant in Month YYYY format"
      - name: grant_date
        description: "The date of the grant, taken to be the first of the month provided"
        granularity: month
        dimension:
          type: time
        data_tests:
          - not_null
      - name: organization_id
        description: "A unique identifier for the organization granted"
        entity:
          type: foreign
          name: organization
      - name: details
        description: "A textual description of the details of the grant"
      - name: org_grant_number
        description: "The order of this grant among all grants to the same organization, starting at 1. Grants in the same month are ordered at random. Grants with no organization are always 1"
        data_tests:
          - not_null
      - name: previous_grant_date
        description: "The date of the organization's previous grant. Null for first grants"
      - name: months_since_previous_grant
        description: "The months between the organization's previous grant and this one. 0 if both were in the same month, null for first grants"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: grant_sequence
        description: "'First' if this is the organization's first grant, otherwise 'Repeat'. Grants with no organization are counted as first grants"
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['First', 'Repeat']
    # Renewals aren't defined here, as they depend on options chosen in the dashboard
    metrics:
      - name: total_grants
        label: "Grants"
        description: "The number of grants"
        type: simple
        agg: count
        expr: grant_id
      - name: first_grants
        label: "First grants"
        description: "Grants to organizations that hadn't received a grant before"
        type: simple
        agg: count
        expr: grant_id
        filter: "{{ Dimension('grant__grant_sequence') }} = 'First'"
      - name: repeat_grants
        label: "Repeat grants"
        description: "Grants to organizations that had received an earlier grant, in any focus area. These are potential candidates to be renewals"
        type: simple
        agg: count
        expr: grant_id
        filter: "{{ Dimension('grant__grant_sequence') }} = 'Repeat'"
      - name: total_grant_amount
        label: "Amount granted"
        description: "The total amount granted in USD"
        type: simple
        agg: sum
        expr: amount
      - name: organizations_granted
        label: "Organizations granted"
        description: "The number of different organizations that received a grant"
        type: simple
        agg: count_distinct
        expr: organization_id

  - name: dim_focus_areas
    description: "The focus areas that grants target"
    semantic_model:
      enabled: true
      name: focus_areas
    columns:
      - name: focus_area
        description: "The name of the focus area the grant targets"
        dimension:
          type: categorical
          name: focus_area_name
      - name: focus_area_id
        description: "A unique identifier for the focus area"
        entity:
          type: primary
          name: focus_area

  - name: dim_organizations
    description: "The organizations that have been provided grants"
    semantic_model:
      enabled: true
      name: organizations
    columns:
      - name: organization
        description: "The name of the organization provided the grant"
        dimension:
          type: categorical
          name: organization_name
      - name: organization_id
        description: "A unique identifier for the organization granted"
        entity:
          type: primary
          name: organization

  - name: dim_dates
    description: "One row per day, used by the Semantic Layer to group metrics by time. Other date dimensions (month, year) should be calcualted automatically by MetricFlow"
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: "The date"
        granularity: day
        data_tests:
          - unique
          - not_null

  - name: mart_grant_pairs
    description: "Every pair of grants to the same organization, where the second came after the first, that could potentially be renewals, depending on definitions"
    columns:
      - name: renewed_grant_id
        description: "The grant id of the later of the two paired grants"
      - name: first_grant_id
        description: "The grant id of the earlier of the two paired grants" 
      - name: renewed_grant_date
        description: "The date that the later of the two grants was made"
      - name: first_grant_date
        description: "The date that the first of the two grants were made"
      - name: organization
        description: "The name of the organisation the grant is for"
      - name: months_since_first
        description: "The months between the first and the second grant. 0 if both were in the same month"
      - name: amount_ratio
        description: "The ratio of the amount that the second grant was for"
      - name: renewed_amount
        description: "The amount of the later of the two paired grants"
      - name: first_amount
        description: "The amount of the earlier of the two paired grants" 
      - name: renewed_focus_area 
        description:  "The focus area of the later of the two paired grants"
      - name: first_focus_area
        description: "The focus area of earlier of the two paired grants" 
      - name: same_focus_area
        description: "Whether the grants are for the same focus area"

# Metrics built from other metrics
metrics:
  - name: repeat_grant_share
    label: "Repeat grants as a share of all grants"
    description: "The share of grants that went to organizations that had received an earlier grant"
    type: ratio
    numerator: repeat_grants
    denominator: total_grants
  - name: average_grant_amount
    label: "Average grant amount"
    description: "The average amount per grant in USD"
    type: ratio
    numerator: total_grant_amount
    denominator: total_grants
